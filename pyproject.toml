[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-contract"
version = "0.1.0"
description = "Compile-time and runtime typecheckers, schema fuzzers, and contract tests for LLM prompts and tool calls."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "HUMMBL", email = "238336761+hummbl-dev@users.noreply.github.com" }
]
keywords = ["llm", "prompt", "contracts", "json-schema", "fuzzer", "testing", "tool-calling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.scripts]
prompt-contract = "prompt_contract.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["prompt_contract*"]
